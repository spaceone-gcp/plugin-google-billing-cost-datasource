# Google Cloud Billing Export 데이터 소스 설정 예시
# 이 파일은 Google Cloud Billing Export 데이터를 처리하기 위한 설정 예시입니다.

options:
  # Google Cloud Storage 버킷 설정 (Google Cloud Billing Export 데이터가 저장된 버킷)
  bucket_name: "gcp-billing-export-bucket"
  
  # 클라우드 제공자 설정
  provider: "google_cloud"
  
  # Google Cloud Billing Export 스키마에 맞는 필드 매핑
  field_mapper:
    # 기본 필수 필드 매핑
    cost: "cost"                                   # 실제 청구 비용
    billed_date: "usage_start_time"                # usage_start_time을 billed_date로 사용
    
    # Google Cloud Billing 전용 필드 매핑
    billing_account_id: "billing_account_id"       # 청구 계정 ID
    service_id: "service.id"                       # Google Cloud 서비스 ID
    service_description: "service.description"     # Google Cloud 서비스 설명
    sku_id: "sku.id"                              # SKU(Stock Keeping Unit) ID
    sku_description: "sku.description"             # SKU 설명
    project_id: "project.id"                       # Google Cloud 프로젝트 ID
    project_name: "project.name"                   # Google Cloud 프로젝트 이름
    location_region: "location.region"             # 리소스 위치 리전
    location_zone: "location.zone"                 # 리소스 위치 존
    invoice_month: "invoice.month"                  # 청구서 발행 월
    usage_start_time: "usage_start_time"           # 사용량 시작 시간
    usage_end_time: "usage_end_time"               # 사용량 종료 시간
    usage_amount: "usage.amount"                   # 사용량
    usage_unit: "usage.unit"                       # 사용량 단위
    usage_pricing_unit: "usage.pricing_unit"       # 가격 책정 단위
    currency: "currency"                           # 통화 코드 (예: USD, KRW)
    cost_type: "cost_type"                         # 비용 유형 (regular, tax, adjustment 등)
    transaction_type: "transaction_type"           # 거래 유형 (charge, refund 등)
    seller_name: "seller_name"                     # 판매자 이름 (Google 또는 마켓플레이스 파트너)
    
    # additional_info에 포함될 필드들
    additional_info:
      billing_account_id: "billing_account_id"                       # 청구 계정 ID
      cost_at_list: "cost_at_list"                                   # 정가 비용 (할인 전)
      cost_after_credits: "cost_after_credits"                       # 크레딧 적용 후 비용
      credits: "credits_detail"                                      # 크레딧 상세 정보
      
      # Google Cloud Pricing Table 문서 기준 추가 필드 (v2.1+)
      effective_discount_percentage: "effective_discount_percentage"  # 유효 할인율 (%)
      tier_usage_amount: "tier_usage_amount"                         # 계층별 사용량
      tier_pricing_unit: "tier_pricing_unit"                         # 계층별 가격 단위
      
      # 기타 분석 필드
      invoice_month: "invoice_month"                                 # 청구서 발행 월
      cost_type: "cost_type"                                         # 비용 유형
      project_name: "project_name"                                   # 프로젝트 이름
      service_id: "service.id"                                       # 서비스 ID
      service_description: "service.description"                     # 서비스 설명
      sku_id: "sku.id"                                              # SKU ID
      sku_description: "sku.description"                             # SKU 설명
      project_id: "project.id"                                       # 프로젝트 ID
      project_number: "project.number"                               # 프로젝트 번호
      project_ancestry_numbers: "project.ancestry_numbers"           # 프로젝트 계층 구조 번호
      location_location: "location.location"                         # 위치 정보
      location_country: "location.country"                           # 국가 정보
      location_region: "location.region"                             # 리전 정보
      location_zone: "location.zone"                                 # 존 정보
      invoice_publisher_type: "invoice.publisher_type"               # 청구서 발행자 유형
      usage_amount: "usage.amount"                                   # 사용량
      usage_unit: "usage.unit"                                       # 사용량 단위
      usage_amount_in_pricing_units: "usage.amount_in_pricing_units" # 가격 단위 기준 사용량
      usage_pricing_unit: "usage.pricing_unit"                       # 가격 책정 단위
      credits: "credits"                                             # 크레딧 정보
      adjustment_info: "adjustment_info"                             # 조정 정보
      export_time: "export_time"                                     # 데이터 내보내기 시간
      cost_at_list: "cost_at_list"                                   # 정가 비용
      transaction_type: "transaction_type"                           # 거래 유형
      seller_name: "seller_name"                                     # 판매자 이름
      currency: "currency"                                           # 통화
      currency_conversion_rate: "currency_conversion_rate"           # 환율
      project_labels: "project.labels"                               # 프로젝트 라벨
      labels: "labels"                                               # 리소스 라벨
      system_labels: "system_labels"                                 # 시스템 라벨
      tags: "tags"                                                   # 태그
  
  # 기본 변수 설정
  default_vars:
    provider: "google_cloud"                         # 클라우드 제공자 (기본값)
    currency: "USD"                                  # 기본 통화 설정
  
  # 타입 매핑 설정
  type_mapper:
    additional_info:
      Account ID: "billing_account_id"               # billing_account_id를 Account ID로 매핑

# 시크릿 데이터 설정 (Google Cloud Service Account 키 정보)
secret_data:
  type: "service_account"                            # 인증 유형 (서비스 계정)
  project_id: "your-gcp-project-id"                 # Google Cloud 프로젝트 ID
  private_key_id: "your-private-key-id"             # 개인 키 ID
  private_key: |                                    # 개인 키 (PEM 형식)
    -----BEGIN PRIVATE KEY-----
    your-private-key-content
    -----END PRIVATE KEY-----
  client_email: "your-service-account@your-project.iam.gserviceaccount.com"  # 서비스 계정 이메일
  client_id: "your-client-id"                       # 클라이언트 ID
  auth_uri: "https://accounts.google.com/o/oauth2/auth"                      # 인증 URI
  token_uri: "https://oauth2.googleapis.com/token"                           # 토큰 URI
  auth_provider_x509_cert_url: "https://www.googleapis.com/oauth2/v1/certs"  # 인증 제공자 인증서 URL
  client_x509_cert_url: "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account%40your-project.iam.gserviceaccount.com"  # 클라이언트 인증서 URL

# 작업별 옵션 설정
task_options:
  bucket_name: "gcp-billing-export-bucket"          # 청구 데이터가 저장된 GCS 버킷명
  # 특정 파일 패턴 필터링 (선택사항)
  file_pattern: "gcp_billing_export_v1_*.csv"       # 처리할 파일 패턴 (정규식 지원)
  # 특정 날짜 범위 필터링 (선택사항)
  date_range:
    start_date: "2024-01-01"                         # 데이터 수집 시작 날짜 (YYYY-MM-DD)
    end_date: "2024-12-31"                           # 데이터 수집 종료 날짜 (YYYY-MM-DD)
