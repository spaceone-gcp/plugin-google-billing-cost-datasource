GLOBAL:
  ENVIRONMENT: dev
  DEBUG: true
  # 순차 처리를 위한 최소 설정
  GRPC_MAX_WORKERS: 1                        # 순차 처리: 워커 1개만 사용
  GRPC_MAX_RECEIVE_MESSAGE_LENGTH: 16777216  # 16MB (기본값으로 복원)
  GRPC_MAX_SEND_MESSAGE_LENGTH: 16777216     # 16MB (기본값으로 복원)

DATABASES: {}

CACHES: {}

CONNECTORS: {}

HANDLERS: {}

LOG: {}

SERVICE:
  spaceone.cost_analysis.plugin.data_source.service.data_source_service:
    - DataSourceService
  spaceone.cost_analysis.plugin.data_source.service.job_service:
    - JobService
  spaceone.cost_analysis.plugin.data_source.service.cost_service:
    - CostService

ENDPOINTS:
  - service: spaceone.cost_analysis.plugin.data_source.service.DataSourceService
    name: DataSource
    endpoint: grpc://localhost:50051
  - service: spaceone.cost_analysis.plugin.data_source.service.JobService
    name: Job
    endpoint: grpc://localhost:50051
  - service: spaceone.cost_analysis.plugin.data_source.service.CostService
    name: Cost
    endpoint: grpc://localhost:50051

SCHEDULERS: {}

WORKERS: {}

TOKEN: ""

QUEUES: {}
