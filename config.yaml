GLOBAL:
  ENVIRONMENT: dev
  DEBUG: true
  # 순차 처리를 위한 최소 설정
  GRPC_MAX_WORKERS: 1                        # 순차 처리: 워커 1개만 사용
  GRPC_MAX_RECEIVE_MESSAGE_LENGTH: 67108864  # 64MB (대용량 데이터 처리)
  GRPC_MAX_SEND_MESSAGE_LENGTH: 67108864     # 64MB (대용량 데이터 처리)

DATABASES: {}

CACHES: {}

CONNECTORS: {}

HANDLERS: {}

LOG:
  loggers:
    spaceone:
      level: DEBUG
    root:
      level: DEBUG
  handlers:
    console:
      class: logging.StreamHandler
      level: DEBUG
      formatter: default
      stream: ext://sys.stdout
  formatters:
    default:
      format: "%(asctime)s [%(name)s] %(levelname)s: %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"

SERVICE:
  spaceone.cost_analysis.plugin.data_source.service.data_source_service:
    - DataSourceService
  spaceone.cost_analysis.plugin.data_source.service.job_service:
    - JobService
  spaceone.cost_analysis.plugin.data_source.service.cost_service:
    - CostService

ENDPOINTS:
  - service: spaceone.cost_analysis.plugin.data_source.service.DataSourceService
    name: DataSource
    endpoint: grpc://localhost:50051
  - service: spaceone.cost_analysis.plugin.data_source.service.JobService
    name: Job
    endpoint: grpc://localhost:50051
  - service: spaceone.cost_analysis.plugin.data_source.service.CostService
    name: Cost
    endpoint: grpc://localhost:50051

SCHEDULERS: {}

WORKERS: {}

TOKEN: ""

QUEUES: {}
